name: EthixAI Performance & Release Pipeline

permissions:
  contents: read
#
# NOTE: This workflow used to duplicate backend/ai_core/frontend testing,
# Docker build checks, integration tests, and security scanning that are
# now owned by dedicated workflows (backend-ci.yml, ci-ai-core.yml,
# frontend-ci.yml, day13-integration-tests.yml, security-scan.yml). Those
# jobs were removed here to stop double-running CI on every push. This
# file now only owns the two jobs that had no equivalent elsewhere:
# Artillery-based performance testing and tagged-release creation.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Performance Tests (on main branch only)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Artillery
        run: npm install -g artillery@latest

      - name: Start services
        run: |
          docker compose up -d --build
          sleep 30

      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:5000/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8100/health; do sleep 2; done'

      - name: Run performance tests
        run: |
          artillery run tools/stress/artillery_baseline.yml --output reports/ci_baseline.json

      - name: Analyze results
        run: |
          python tools/stress/analyze_results.py \
            --input reports/ci_baseline.json \
            --output reports/ci_summary.txt

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports/

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('reports/ci_summary.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Performance Test Results\n\`\`\`\n${summary}\n\`\`\``
            });

      - name: Shutdown services
        if: always()
        run: docker compose down

  # Create release (on version tags)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [performance-tests]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.performance-tests.result != 'failure'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: EthixAI ${{ github.ref }}
          body: |
            ## What's Changed
            - Production-ready release
            - All tests passing
            - Performance validated
            - Security hardened

            See [CHANGELOG.md](CHANGELOG.md) for full details.
          draft: false
