# Production Deployment Workflow (Canary Strategy)
#
# Flow: main branch → Build & Test → Push Images → Deploy Staging → Smoke Tests
#       → Deploy Canary (10%) → Monitor → Promote to 100% OR Rollback
#
# Secrets Required (GitHub Secrets):
# - GCP_WORKLOAD_IDENTITY_PROVIDER: Workload Identity Federation provider
# - GCP_SERVICE_ACCOUNT_EMAIL: Service account for deployments
# - SLACK_WEBHOOK_URL: Notifications channel
# - SENTRY_AUTH_TOKEN: Create Sentry release
#
# Manual Trigger Variables:
# - environment: production (default) or staging
# - skip_canary: false (default) or true (direct deploy to 100%)

name: Deploy Production (Canary)

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_canary:
        description: 'Skip canary phase (deploy directly to 100%)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ethixai-production
  GCP_REGION: us-east1
  # BACKEND_IMAGE, AI_CORE_IMAGE and FRONTEND_IMAGE are set at runtime in the
  # "Set variables" step below after lower-casing the repository owner so
  # registry references are valid (ghcr requires lowercase repository names).

jobs:
  # =========================
  # Job 1: Build & Test
  # =========================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image_tag: ${{ steps.meta-backend.outputs.tags }}
      ai_core_image_tag: ${{ steps.meta-ai-core.outputs.tags }}
      frontend_image_tag: ${{ steps.meta-frontend.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      release_version: ${{ steps.vars.outputs.release_version }}
      backend_image: ${{ steps.vars.outputs.backend_image }}
      ai_core_image: ${{ steps.vars.outputs.ai_core_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          # Short SHA and release version (used as step outputs)
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_version=v$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          # Compute lowercase repository owner to ensure GHCR references are valid
          # (ghcr requires lowercase repository/owner names). Use the github
          # context value and convert to lowercase in-shell, then export images
          # to GITHUB_ENV so they are available as env.BACKEND_IMAGE etc. later.
          owner="${{ github.repository_owner }}"
          owner_lower=$(echo "${owner}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/ethixai-backend" >> $GITHUB_ENV
          echo "AI_CORE_IMAGE=ghcr.io/${owner_lower}/ethixai-ai-core" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/ethixai-frontend" >> $GITHUB_ENV

          # Also publish as step outputs so downstream jobs (which run on
          # fresh runners and cannot see this job's GITHUB_ENV) can consume
          # them via needs.build-test.outputs.*
          echo "backend_image=ghcr.io/${owner_lower}/ethixai-backend" >> $GITHUB_OUTPUT
          echo "ai_core_image=ghcr.io/${owner_lower}/ethixai-ai-core" >> $GITHUB_OUTPUT
          echo "frontend_image=ghcr.io/${owner_lower}/ethixai-frontend" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend: Build + Test
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.vars.outputs.release_version }}
            type=raw,value=latest

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Test backend (unit + integration)
        run: |
          docker run --rm \
            -e NODE_ENV=test \
            -e MONGO_URL=mongodb://localhost:27017/test \
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            npm test

      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache

      # AI Core: Build + Test
      - name: Extract metadata (ai_core)
        id: meta-ai-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AI_CORE_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.vars.outputs.release_version }}
            type=raw,value=latest

      - name: Build ai_core image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_core
          file: ./ai_core/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-ai-core.outputs.tags }}
          cache-from: type=registry,ref=${{ env.AI_CORE_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.AI_CORE_IMAGE }}:buildcache,mode=max

      - name: Test ai_core (unit tests)
        run: |
          docker run --rm \
            -e ENVIRONMENT=test \
            ${{ env.AI_CORE_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} \
            pytest tests/ -v --tb=short

      - name: Push ai_core image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_core
          file: ./ai_core/Dockerfile
          push: true
          tags: ${{ steps.meta-ai-core.outputs.tags }}
          cache-from: type=registry,ref=${{ env.AI_CORE_IMAGE }}:buildcache

      # Frontend: Build + Push
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.vars.outputs.release_version }}
            type=raw,value=latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Scan images for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Scan ai_core image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.AI_CORE_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Scan frontend image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}


  # =========================
  # Job 2: Deploy to Staging
  # =========================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy backend to staging
        run: |
          gcloud run deploy ethixai-backend-staging \
            --image ${{ needs.build-test.outputs.backend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 1 \
            --max-instances 3 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars NODE_ENV=staging,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --service-account backend-staging@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --tag staging-${{ needs.build-test.outputs.short_sha }}

      - name: Deploy ai_core to staging
        run: |
          gcloud run deploy ethixai-ai-core-staging \
            --image ${{ needs.build-test.outputs.ai_core_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 1 \
            --max-instances 3 \
            --cpu 2 \
            --memory 1Gi \
            --set-env-vars ENVIRONMENT=staging,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --service-account ai-core-staging@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --tag staging-${{ needs.build-test.outputs.short_sha }}

      - name: Deploy frontend to staging
        run: |
          gcloud run deploy ethixai-frontend-staging \
            --image ${{ needs.build-test.outputs.frontend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 1 \
            --max-instances 2 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars NODE_ENV=staging,NEXT_PUBLIC_API_URL=https://ethixai-backend-staging-${{ env.GCP_REGION }}.run.app \
            --service-account frontend-staging@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --tag staging-${{ needs.build-test.outputs.short_sha }}

      - name: Get staging URLs
        id: staging-urls
        run: |
          BACKEND_URL=$(gcloud run services describe ethixai-backend-staging --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          AI_CORE_URL=$(gcloud run services describe ethixai-ai-core-staging --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "ai_core_url=$AI_CORE_URL" >> $GITHUB_OUTPUT

      - name: Run smoke tests (staging)
        run: |
          BACKEND_URL=${{ steps.staging-urls.outputs.backend_url }}
          
          # Health check
          curl -f -s $BACKEND_URL/health/readiness || exit 1
          
          # Auth flow
          SMOKE_PASSWORD=$(openssl rand -hex 12)
          REGISTER_RESP=$(curl -s -X POST $BACKEND_URL/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-test-'$(date +%s)'@example.com","password":"'$SMOKE_PASSWORD'"}')
          
          echo $REGISTER_RESP | jq -e '.token' || exit 1
          echo "✅ Smoke tests passed"

      - name: Notify Slack (staging deployed)
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚀 Staging deployed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment* ✅\n*Version:* `${{ needs.build-test.outputs.release_version }}`\n*Backend:* ${{ steps.staging-urls.outputs.backend_url }}"
                  }
                }
              ]
            }'

  # =========================
  # Job 3: Deploy Canary (10%)
  # =========================
  deploy-canary:
    name: Deploy Canary (10%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-test, deploy-staging]
    if: github.ref == 'refs/heads/main' && inputs.skip_canary != true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy canary backend (10% traffic)
        run: |
          gcloud run deploy ethixai-backend \
            --image ${{ needs.build-test.outputs.backend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --no-traffic \
            --tag canary-${{ needs.build-test.outputs.short_sha }}
          
          # Get current stable revision
          STABLE_REVISION=$(gcloud run services describe ethixai-backend \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.traffic[0].revisionName)')
          
          # Split traffic: 90% stable, 10% canary
          gcloud run services update-traffic ethixai-backend \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=$STABLE_REVISION=90,canary-${{ needs.build-test.outputs.short_sha }}=10

      - name: Deploy canary ai_core (10% traffic)
        run: |
          gcloud run deploy ethixai-ai-core \
            --image ${{ needs.build-test.outputs.ai_core_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --no-traffic \
            --tag canary-${{ needs.build-test.outputs.short_sha }}
          
          STABLE_REVISION=$(gcloud run services describe ethixai-ai-core \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.traffic[0].revisionName)')
          
          gcloud run services update-traffic ethixai-ai-core \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=$STABLE_REVISION=90,canary-${{ needs.build-test.outputs.short_sha }}=10

      - name: Notify Slack (canary deployed)
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🐤 Canary deployed (10% traffic)",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Canary Deployment* 🐤\n*Version:* `${{ needs.build-test.outputs.release_version }}`\n*Traffic Split:* 10% canary / 90% stable\n*Monitoring for 15 minutes...*"
                  }
                }
              ]
            }'

      - name: Monitor canary metrics (15 minutes)
        run: |
          echo "Monitoring canary for 15 minutes..."
          MONITOR_DURATION=900  # 15 minutes
          CHECK_INTERVAL=60    # Check every 60 seconds
          ELAPSED=0
          MAX_ERROR_RATE=0.005  # 0.5% threshold
          CONSECUTIVE_FAILURES=0
          MAX_FAILURES=3        # Auto-rollback after 3 consecutive failures

          while [ $ELAPSED -lt $MONITOR_DURATION ]; do
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
            REMAINING=$((MONITOR_DURATION - ELAPSED))

            # Query Prometheus for error rate (last 5m window)
            ERROR_RATE=$(curl -sf --max-time 10 "http://prometheus:9090/api/v1/query?query=rate(http_requests_total{job=\"backend\",status=~\"5..\"}[5m])/rate(http_requests_total{job=\"backend\"}[5m])" \
              | jq -r '.data.result[0].value[1] // "0"' 2>/dev/null || echo "0")

            # Query for P95 latency
            P95_LATENCY=$(curl -sf --max-time 10 "http://prometheus:9090/api/v1/query?query=histogram_quantile(0.95,rate(http_request_duration_seconds_bucket{job=\"backend\"}[5m]))" \
              | jq -r '.data.result[0].value[1] // "0"' 2>/dev/null || echo "0")

            echo "[${ELAPSED}s/${MONITOR_DURATION}s] Error rate: ${ERROR_RATE} | P95 latency: ${P95_LATENCY}s | Remaining: ${REMAINING}s"

            # Check error rate threshold
            if (( $(echo "$ERROR_RATE > $MAX_ERROR_RATE" | bc -l 2>/dev/null || echo 0) )); then
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
              echo "⚠️  Error rate above threshold (${CONSECUTIVE_FAILURES}/${MAX_FAILURES} consecutive failures)"

              if [ $CONSECUTIVE_FAILURES -ge $MAX_FAILURES ]; then
                echo "❌ Canary auto-rollback triggered: ${MAX_FAILURES} consecutive threshold breaches"
                exit 1
              fi
            else
              CONSECUTIVE_FAILURES=0
            fi

            # Check latency threshold (> 1s P95)
            if (( $(echo "$P95_LATENCY > 1.0" | bc -l 2>/dev/null || echo 0) )); then
              echo "⚠️  High P95 latency detected: ${P95_LATENCY}s"
            fi
          done

          echo "✅ Canary metrics healthy after ${MONITOR_DURATION}s monitoring period"

      - name: Rollback canary on failure
        if: failure()
        run: |
          echo "Rolling back canary..."

          # Rollback backend
          STABLE_REVISION=$(gcloud run services describe ethixai-backend \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.traffic[0].revisionName)')

          gcloud run services update-traffic ethixai-backend \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=$STABLE_REVISION=100

          # Rollback ai_core
          STABLE_AI_REVISION=$(gcloud run services describe ethixai-ai-core \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.traffic[0].revisionName)')

          gcloud run services update-traffic ethixai-ai-core \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=$STABLE_AI_REVISION=100

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ Canary rollback triggered — both backend and ai_core traffic restored to stable"}'

  # =========================
  # Job 4: Promote Canary to 100%
  # =========================
  promote-canary:
    name: Promote to Production (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-test, deploy-canary]
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Promote backend to 100%
        run: |
          gcloud run services update-traffic ethixai-backend \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=canary-${{ needs.build-test.outputs.short_sha }}=100

      - name: Promote ai_core to 100%
        run: |
          gcloud run services update-traffic ethixai-ai-core \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=canary-${{ needs.build-test.outputs.short_sha }}=100

      - name: Deploy frontend to production
        run: |
          gcloud run deploy ethixai-frontend \
            --image ${{ needs.build-test.outputs.frontend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 2 \
            --max-instances 5 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_API_URL=https://ethixai-backend-${{ env.GCP_REGION }}.run.app,NEXT_TELEMETRY_DISABLED=1 \
            --service-account frontend@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Run database migrations
        run: |
          echo "Running Postgres migrations against production..."
          # Trigger migration via the backend's admin endpoint or run via Cloud SQL Proxy

          # cloud-sql-proxy ethixai-production:us-east1:ethixai-db &
          # sleep 5
          # cd backend && node scripts/migrate_postgres.js
          echo "⚠️  Database migration step — configure Cloud SQL Proxy or admin endpoint for your setup"

      - name: Create Sentry release
        run: |
          curl -X POST https://sentry.io/api/0/organizations/ethixai/releases/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ needs.build-test.outputs.release_version }}",
              "refs": [{
                "repository": "${{ github.repository }}",
                "commit": "${{ github.sha }}"
              }],
              "projects": ["backend", "ai-core"]
            }'

      - name: Notify Slack (production deployed)
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Production deployment complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* 🚀\n*Version:* `${{ needs.build-test.outputs.release_version }}`\n*Status:* Fully promoted (100% traffic)\n*Commit:* `${{ github.sha }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Logs"},
                      "url": "https://console.cloud.google.com/run?project=${{ env.GCP_PROJECT_ID }}"
                    }
                  ]
                }
              ]
            }'

  # =========================
  # Job 5: Deploy Direct (Skip Canary)
  # =========================
  deploy-direct:
    name: Deploy Production (Direct 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-test, deploy-staging]
    if: github.ref == 'refs/heads/main' && inputs.skip_canary == true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy backend (100% traffic)
        run: |
          gcloud run deploy ethixai-backend \
            --image ${{ needs.build-test.outputs.backend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 3 \
            --max-instances 13 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars NODE_ENV=production,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},RELEASE_VERSION=${{ needs.build-test.outputs.release_version }} \
            --service-account backend@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Deploy ai_core (100% traffic)
        run: |
          gcloud run deploy ethixai-ai-core \
            --image ${{ needs.build-test.outputs.ai_core_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 6 \
            --max-instances 11 \
            --cpu 2 \
            --memory 1Gi \
            --set-env-vars ENVIRONMENT=production,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},RELEASE_VERSION=${{ needs.build-test.outputs.release_version }} \
            --service-account ai-core@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Deploy frontend (100% traffic)
        run: |
          gcloud run deploy ethixai-frontend \
            --image ${{ needs.build-test.outputs.frontend_image }}:sha-${{ needs.build-test.outputs.short_sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --min-instances 2 \
            --max-instances 5 \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars NODE_ENV=production,NEXT_PUBLIC_API_URL=https://ethixai-backend-${{ env.GCP_REGION }}.run.app,NEXT_TELEMETRY_DISABLED=1 \
            --service-account frontend@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Run database migrations
        run: |
          echo "Running Postgres migrations against production..."
          echo "⚠️  Configure Cloud SQL Proxy or admin endpoint for your setup"


      - name: Notify Slack (direct deploy)
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "⚠️ Production deployed directly (canary skipped)",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* ⚡\n*Version:* `${{ needs.build-test.outputs.release_version }}`\n*Mode:* Direct (100% traffic, no canary)\n*Triggered by:* ${{ github.actor }}"
                  }
                }
              ]
            }'
