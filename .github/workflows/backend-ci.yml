name: Backend CI & Accessibility Smoke

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linting
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        env:
          USE_IN_MEMORY_DB: '1'
        run: npm test

  frontend-axe-smoke-check:
    name: Frontend axe smoke check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FRONTEND_SMOKE_URL: ${{ secrets.FRONTEND_SMOKE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install axe smoke checker deps
        working-directory: frontend
        run: npm ci

      - name: Install Chromium (system) - best-effort
        if: ${{ env.FRONTEND_SMOKE_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || true

      - name: Run axe smoke check
        if: ${{ env.FRONTEND_SMOKE_URL != '' }}
        working-directory: frontend
        env:
          TARGET_URL: ${{ env.FRONTEND_SMOKE_URL }}
          CHROMIUM_PATH: /usr/bin/chromium-browser
          OUTPUT_PATH: ./reports/axe-results.json
          FAIL_ON_SEVERITY: serious
        run: node ./tools/axe-check.cjs

      - name: Upload axe results (artifact)
        if: ${{ always() && env.FRONTEND_SMOKE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: ./frontend/reports/
