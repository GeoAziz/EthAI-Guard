name: E2E Tests (Playwright)

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:6
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_core/requirements.txt'

      - name: Install dependencies
        run: |
          cd backend && npm install
          cd ../frontend && npm install
          cd ../ai_core && pip install -r requirements.txt

      - name: Start backend
        run: |
          cd backend
          USE_IN_MEMORY_DB=1 DISABLE_RATE_LIMIT=1 npm start &
          sleep 3
        env:
          NODE_ENV: test
          MONGO_URL: mongodb://localhost:27017/ethixai_test

      - name: Start AI Core
        run: |
          cd ai_core
          uvicorn main:app --host 0.0.0.0 --port 8100 &
          sleep 3

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev &
          sleep 5

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps

      - name: Run E2E tests
        run: cd frontend && npm run e2e
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: junit-results.xml

      - name: Generate Playwright report
        if: always()
        run: |
          cd frontend
          npx playwright show-report || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-results
          path: frontend/junit-results.xml
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/junit-results.xml
          check_name: E2E Test Results
          comment_title: E2E Test Report

      - name: Slack notification on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'E2E tests failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

  e2e-test-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: e2e-tests

    steps:
      - name: Test status summary
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed"
          else
            echo "❌ E2E tests failed"
            exit 1
          fi
