name: pre-commit

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    paths: [ '**' ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit hooks (fast hygiene only)
        # Scoped to hooks with no equivalent elsewhere. detect-secrets,
        # security-gate, bandit-ai-core, and eslint-security-* duplicate
        # jobs already owned by security-scan.yml / security-extra.yml
        # (which produce SARIF/artifacts pre-commit doesn't); running both
        # on every push/PR was pure duplicate spend. Those hooks still run
        # for local developer commits via .pre-commit-config.yaml directly.
        run: |
          pre-commit run --all-files \
            trailing-whitespace end-of-file-fixer check-yaml check-added-large-files black
