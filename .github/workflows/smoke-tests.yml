name: Smoke Tests

permissions:
  contents: read

on:
  # Nightly-only: day16-smoke-and-probes.yml already covers the same
  # register/login/health golden path on every push to main via the shared
  # docker-compose stack and tools/smoke_tests/run_smoke_tests.sh, and does
  # so with hard assertions (this workflow's inline curl steps are mostly
  # non-blocking `|| true`). Running both on every push was pure duplicate
  # spend, so this one is now the deeper nightly regression pass instead.
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:6
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_core/requirements.txt'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install AI Core dependencies
        run: cd ai_core && pip install -r requirements.txt

      - name: Start backend
        run: |
          cd backend
          USE_IN_MEMORY_DB=1 DISABLE_RATE_LIMIT=1 \
          AI_CORE_URL=http://localhost:8100/ai_core/analyze \
          npm start &
          sleep 3
        env:
          NODE_ENV: test
          MONGO_URL: mongodb://localhost:27017/ethixai_test
          REDIS_URL: redis://localhost:6379

      - name: Start AI Core
        run: |
          cd ai_core
          AI_CORE_TRUSTED_HOSTS=localhost \
          AI_CORE_ALLOWED_ORIGINS="http://localhost:3000,http://localhost:5000" \
          uvicorn main:app --host 0.0.0.0 --port 8100 &
          sleep 3
        env:
          NODE_ENV: test

      - name: Health Check - Backend
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5000/health/liveness; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i/10 - waiting for backend..."
            sleep 2
          done
          echo "❌ Backend failed health check"
          exit 1

      - name: Health Check - AI Core
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8100/health; then
              echo "✅ AI Core health check passed"
              exit 0
            fi
            echo "Attempt $i/10 - waiting for AI Core..."
            sleep 2
          done
          echo "❌ AI Core failed health check"
          exit 1

      - name: Test - User Registration
        run: |
          curl -X POST http://localhost:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "email": "smoketest@example.com",
              "password": "SmokTest123!",
              "first_name": "Smoke",
              "last_name": "Test"
            }' \
            -w "\nStatus: %{http_code}\n" || true

      - name: Test - User Login
        run: |
          TOKEN=$(curl -s -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "email": "smoketest@example.com",
              "password": "SmokTest123!"
            }' | jq -r '.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "⚠️ Login returned no token (may be expected in test mode)"
          else
            echo "✅ Login successful, token obtained"
            echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          fi

      - name: Test - Model Upload
        run: |
          curl -X POST http://localhost:5000/v1/models \
            -H "Content-Type: application/json" \
            -d '{
              "name": "SmokeTest Model",
              "framework": "scikit-learn",
              "input_shape": [10],
              "output_shape": [1]
            }' \
            -w "\nStatus: %{http_code}\n" || true

      - name: Test - Dataset Operations
        run: |
          curl -X POST http://localhost:5000/v1/datasets \
            -H "Content-Type: application/json" \
            -d '{
              "name": "SmokeTest Dataset",
              "rows": 1000,
              "columns": 5
            }' \
            -w "\nStatus: %{http_code}\n" || true

      - name: Test - Fairness Analysis (Quick)
        run: |
          curl -X POST http://localhost:5000/v1/analyze/fairness \
            -H "Content-Type: application/json" \
            -d '{
              "dataset_id": "test_ds",
              "outcome_column": "outcome",
              "protected_attributes": ["gender"]
            }' \
            -w "\nStatus: %{http_code}\n" || true
        timeout-minutes: 5

      - name: Test - Report Generation
        run: |
          curl -X POST http://localhost:5000/v1/reports/generate \
            -H "Content-Type: application/json" \
            -d '{
              "analysis_id": "test_analysis",
              "report_type": "fairness_compliance"
            }' \
            -w "\nStatus: %{http_code}\n" || true

      - name: Metrics Check
        run: |
          echo "🔍 Checking Prometheus metrics..."
          curl -s http://localhost:5000/metrics | head -20 || true
          echo ""
          echo "✅ Smoke tests completed"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            backend/coverage
            ai_core/htmlcov
          retention-days: 7

      - name: Notify - Test Summary
        if: always()
        run: |
          echo "## Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All critical paths validated:" >> $GITHUB_STEP_SUMMARY
          echo "- Backend service health" >> $GITHUB_STEP_SUMMARY
          echo "- AI Core service health" >> $GITHUB_STEP_SUMMARY
          echo "- User authentication flow" >> $GITHUB_STEP_SUMMARY
          echo "- Model and dataset operations" >> $GITHUB_STEP_SUMMARY
          echo "- Fairness analysis capability" >> $GITHUB_STEP_SUMMARY
          echo "- Report generation" >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Run Playwright e2e tests
        run: cd frontend && npm run e2e
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [smoke-tests, e2e-tests]

    steps:
      - name: Determine Status
        run: |
          if [ "${{ needs.smoke-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "⚠️ Some tests failed or were skipped"
            exit 1
          fi
