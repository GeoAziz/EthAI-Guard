[metadata]
name = ai_core
version = 0.0.0
description = AI core service package

[options]
packages = find:
include_package_data = True
install_requires =
	# Managed via requirements.txt for development; keep minimal here.

[options.packages.find]
where = .
exclude =
	node_modules
	.venv
	tests
	docs
	logs
	.pytest_cache
	__pycache__

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = --cov=ai_core --cov-report=html --cov-report=term-missing --cov-report=json --cov-report=lcov
norecursedirs = .git .venv __pycache__

[coverage:run]
branch = True
omit =
	*/tests/*
	*/site-packages/*
	*/__pycache__/*

[coverage:report]
exclude_lines =
	pragma: no cover
	def __repr__
	raise AssertionError
	raise NotImplementedError
	if __name__ == .__main__.:
	if TYPE_CHECKING:
	@abstractmethod
